[project]
name = "eduserver-painel"
version = "0.1.0"
description = "Serviço do painel frontal do eduServer Box: manda o estado do servidor para o Nano pela USB."
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "psutil>=5.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Prévia das telas em PNG, sem o Nano (eduserver-painel simular).
sim = ["pillow>=10.1"]

[project.scripts]
eduserver-painel = "eduserver_painel.principal:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=10.1", "ruff==0.17.5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eduserver_painel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "preserve"
