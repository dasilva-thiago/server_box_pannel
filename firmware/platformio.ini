; Firmware do painel frontal do eduServer Box (Arduino Nano, ATmega328P).
;
; Ambientes:
;   painel         programa do painel, Nano com bootloader NOVO (Optiboot), com watchdog
;   painel_antigo  programa do painel, Nano com bootloader ANTIGO (comum nos clones CH340), sem watchdog
;   t_tela, t_rfid, t_buzzer, t_led   testes da bancada, um módulo por vez (docs/04_bancada.md)
;   nativo         testes do protocolo no PC (precisa de gcc; roda no CI)
;
; Gravar:   pio run -e painel -t upload
; Monitor:  pio device monitor
;
; Qual bootloader o seu Nano tem? Tente gravar com "painel". Se der "not in sync" ou
; "programmer is not responding", o bootloader é o antigo: use "painel_antigo" e troque
; a placa da seção [placa] abaixo para nanoatmega328.

[platformio]
default_envs = painel

[placa]
; Placa usada pelos testes da bancada. Novo: nanoatmega328new. Antigo: nanoatmega328.
board = nanoatmega328new

[comum]
platform = atmelavr@5.1.0
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    miguelbalboa/MFRC522@1.4.12
; Buffer de recepção da serial com folga (o padrão é 64): uma linha de 63 caracteres
; mais o '\n' não transborda enquanto a tela está desenhando.
build_flags = -DSERIAL_RX_BUFFER_SIZE=128
; Avisos do compilador só no nosso código (as bibliotecas têm os delas).
build_src_flags = -Wall -Wextra

[env:painel]
extends = comum
board = nanoatmega328new
; O watchdog só é seguro com o Optiboot. No bootloader antigo, um reinício pelo
; watchdog deixa o Nano reiniciando sem parar.
build_flags = ${comum.build_flags} -DUSAR_WDT
build_src_filter = +<*> -<bancada/>

[env:painel_antigo]
extends = comum
board = nanoatmega328
build_src_filter = +<*> -<bancada/>

[env:t_tela]
extends = comum
board = ${placa.board}
build_src_filter = -<*> +<bancada/t_tela.cpp> +<tela.cpp>

[env:t_rfid]
extends = comum
board = ${placa.board}
build_src_filter = -<*> +<bancada/t_rfid.cpp>

[env:t_buzzer]
extends = comum
board = ${placa.board}
build_src_filter = -<*> +<bancada/t_buzzer.cpp> +<buzzer.cpp>

[env:t_led]
extends = comum
board = ${placa.board}
build_src_filter = -<*> +<bancada/t_led.cpp> +<led.cpp>

[env:nativo]
platform = native
test_framework = unity
build_src_filter = -<*>
